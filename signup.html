<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Inventory Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img
        class="logo-mark"
        src="images/rohde-schwarz-logo.jpg"
        alt="Rohde & Schwarz"
      />

      <span class="brand-copy">
        <span class="brand-product">Inventory Portal</span>
      </span>
    </a>
  </header>

  <main class="page">
    <section class="card wide">

      <h1>Sign Up</h1>
      <p class="subtitle">Create your account to get started.</p>

      <form id="signup-form">

        <div class="signup-layout">

          <!-- Profile Photo -->
          <label class="photo-upload">
            <input
              id="photo"
              type="file"
              accept="image/jpeg,image/png"
              hidden
            />

            <span class="photo-circle" id="photo-preview">
              <svg
                width="36"
                height="36"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              >
                <circle cx="12" cy="12" r="9"/>
                <path d="M8 14h8M12 8v6"/>
                <circle cx="12" cy="10" r="2"/>
                <path d="M7 17h10"/>
              </svg>
            </span>

            <strong>Upload Photo</strong>
            <small>JPG, PNG (Max 2MB)</small>
          </label>


          <!-- Form Fields -->
          <div class="form-grid">

            <!-- Full Name -->
            <div class="field">
              <label for="full-name">Full Name</label>

              <div class="input-wrap no-lead">
                <input
                  id="full-name"
                  type="text"
                  placeholder="Full Name"
                />
              </div>
            </div>


            <!-- Date of Birth -->
            <div class="field">
              <label for="dob">Date of Birth</label>

              <div class="input-wrap no-lead">
                <input
                  id="dob"
                  type="date"
                />

                <span
                  class="trail-icon"
                  style="pointer-events:none"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <rect
                      x="4"
                      y="5"
                      width="16"
                      height="16"
                      rx="2"
                    />
                    <path d="M8 3v4M16 3v4M4 11h16"/>
                  </svg>
                </span>
              </div>
            </div>


            <!-- Email -->
            <div class="field">
              <label for="email">Email</label>

              <div class="input-wrap no-lead">
                <input
                  id="email"
                  type="email"
                  placeholder="Email"
                />
              </div>
            </div>


            <!-- Phone Number -->
            <div class="field">
              <label for="phone">Phone Number</label>

              <div class="input-wrap no-lead">
                <input
                  id="phone"
                  type="tel"
                  placeholder="Phone Number"
                />
              </div>
            </div>

            <!-- Location -->
            <div class="field">
              <label for="location">Location</label>

              <div class="input-wrap no-lead">
                <select id="location">
                  <option value="">Location</option>
                  <option value="islamabad">Islamabad</option>
                  <option value="karachi">Karachi</option>
                </select>
              </div>
            </div>


            <!-- Password -->
            <div class="field">
              <label for="password">Password</label>

              <div class="input-wrap no-lead">
                <input
                  id="password"
                  type="password"
                  placeholder="Password"
                />

                <button
                  class="trail-icon"
                  type="button"
                  data-password-toggle="password"
                  aria-label="Show password"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                    />
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>


            <!-- Confirm Password -->
            <div class="field">
              <label for="confirm-password">Confirm Password</label>

              <div class="input-wrap no-lead">
                <input
                  id="confirm-password"
                  type="password"
                  placeholder="Confirm Password"
                />

                <button
                  class="trail-icon"
                  type="button"
                  data-password-toggle="confirm-password"
                  aria-label="Show password"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                    />
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </div>

          </div>
        </div>


        <!-- Terms -->
        <label class="check terms">
          <input id="terms" type="checkbox" />
          <span>
            I agree to the Terms and Conditions and Privacy Policy.
          </span>
        </label>


        <p id="form-error" class="error"></p>


        <!-- Sign Up Button -->
        <button class="btn" type="submit">
          Sign Up
        </button>

      </form>


      <p class="alt-line">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </section>
  </main>


  <footer class="site-footer">
    © 2025 Inventory Portal. All rights reserved.
  </footer>


  <script src="js/portal.js"></script>

</body>
</html>
