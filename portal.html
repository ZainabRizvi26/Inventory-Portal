<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Portal Type | Inventory Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="logo-mark" src="images/rohde-schwarz-logo.jpg" alt="Rohde & Schwarz" />
      <span class="brand-copy">
        <span class="brand-product">Inventory Portal</span>
      </span>
    </a>
  </header>

  <main class="page">
    <section class="card">
      <h1>Choose Portal Type</h1>
      <p class="subtitle">Select how you want to continue.</p>
      <div class="choice-list">
        <button class="choice" type="button" id="choose-user">
          <span class="choice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <circle cx="12" cy="8" r="3.2"/>
              <path d="M6 19c.8-3.2 3-5 6-5s5.2 1.8 6 5"/>
            </svg>
          </span>
          <span class="choice-copy">
            <strong>User Portal</strong>
            <span>Access your account and services.</span>
          </span>
          <span class="chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
          </span>
        </button>
        <button class="choice" type="button" id="choose-admin">
          <span class="choice-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>
            </svg>
          </span>
          <span class="choice-copy">
            <strong>Admin Portal</strong>
            <span>Manage users, inventory and settings.</span>
          </span>
          <span class="chevron">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
          </span>
        </button>
      </div>
      <a class="back-link" href="index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </a>
    </section>
  </main>

  <footer class="site-footer">© 2025 Inventory Portal. All rights reserved.</footer>
  <script src="js/portal.js"></script>
  <script>
    document.getElementById("choose-user").onclick = function () {
      Portal.setPortalType("user");
      location.href = "login.html";
    };
    document.getElementById("choose-admin").onclick = function () {
      Portal.setPortalType("admin");
      location.href = "login.html";
    };
  </script>
</body>
</html>
