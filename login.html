<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#04255c" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Login | Inventory Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-copy">
        <span class="brand-product">Inventory Portal</span>
      </span>
    </a>
    <img class="header-diamond" src="images/rs-diamond-card.png" alt="Rohde &amp; Schwarz" />
  </header>

  <main class="page">
    <section class="card">
      <h1>Login</h1>
      <p class="subtitle">Welcome back! Please login to your account.</p>
      <div id="toast" class="toast">Your password has been reset. Please login.</div>
      <form id="login-form">
        <div class="segmented" data-segmented data-input="identifier" data-icon="id-icon">
          <button type="button" class="active" data-mode="username">Username</button>
          <button type="button" data-mode="email">Email</button>
        </div>
        <div class="field">
          <div class="input-wrap">
            <span class="lead-icon" id="id-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M6 19c.8-3.2 3-5 6-5s5.2 1.8 6 5"/></svg>
            </span>
            <input id="identifier" name="username" type="text" placeholder="Enter username" autocomplete="username" />
          </div>
        </div>
        <div class="field">
          <div class="input-wrap">
            <span class="lead-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </span>
            <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" />
            <button class="trail-icon" type="button" data-password-toggle="password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="row-between">
          <label class="check"><input type="checkbox" name="remember" /> Remember me</label>
          <a href="forgot-password.html">Forgot Password?</a>
        </div>
        <p id="form-error" class="error"></p>
        <button class="btn" type="submit">Login</button>
      </form>
      <p class="alt-line">Don't have an account? <a href="signup.html">Sign up</a></p>
    </section>
  </main>

  <footer class="site-footer">© 2025 Inventory Portal. All rights reserved.</footer>
  <script src="js/portal.js"></script>
</body>
</html>
