<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#04255c" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Reset Password | Inventory Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-copy">
        <span class="brand-product">Inventory Portal</span>
      </span>
    </a>
    <img class="header-diamond" src="images/rs-diamond-card.png" alt="Rohde &amp; Schwarz" />
  </header>

  <main class="page">
    <section class="card">
      <h1>Reset Password</h1>
      <p class="subtitle">Enter your new password.</p>
      <form id="reset-form">
        <div class="field">
          <label for="new-password">New Password</label>
          <div class="input-wrap no-lead">
            <input id="new-password" type="password" placeholder="Enter new password" />
            <button class="trail-icon" type="button" data-password-toggle="new-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap no-lead">
            <input id="confirm-password" type="password" placeholder="Confirm new password" />
            <button class="trail-icon" type="button" data-password-toggle="confirm-password" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <p id="form-error" class="error"></p>
        <button class="btn" type="submit">Reset Password</button>
      </form>
      <a class="back-link" href="login.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Back to Login
      </a>
    </section>
  </main>

  <footer class="site-footer">© 2025 Inventory Portal. All rights reserved.</footer>
  <script src="js/portal.js"></script>
</body>
</html>
