<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#04255c" />
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>Forgot Password | Inventory Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-copy">
        <span class="brand-product">Inventory Portal</span>
      </span>
    </a>
    <img class="header-diamond" src="images/rs-diamond-card.png" alt="Rohde &amp; Schwarz" />
  </header>

  <main class="page">
    <section class="card">
      <h1>Forgot Password</h1>
      <p class="subtitle">No worries! Enter your email or username and we'll send you a reset link.</p>
      <form id="forgot-form">
        <div class="segmented" data-segmented data-input="identifier" data-icon="id-icon">
          <button type="button" data-mode="username">Username</button>
          <button type="button" class="active" data-mode="email">Email</button>
        </div>
        <div class="field">
          <div class="input-wrap">
            <span class="lead-icon" id="id-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
            </span>
            <input id="identifier" name="email" type="email" placeholder="Enter your email address" />
          </div>
        </div>
        <p id="form-error" class="error"></p>
        <button class="btn" type="submit">Send Reset Link</button>
      </form>
      <a class="back-link" href="login.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Back to Login
      </a>
    </section>
  </main>

  <footer class="site-footer">© 2025 Inventory Portal. All rights reserved.</footer>
  <script src="js/portal.js"></script>
</body>
</html>
